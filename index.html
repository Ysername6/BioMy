<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolzer Bio</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0a0a0a;
            --border-color: #222222;
            --text-main: #ffffff;
            --text-secondary: #999999;
            --accent: #4caf50;
            --avatar-border: #888888;
            --button-hover: #555555;
            --button-active: #777777;
            --progress-color: #4caf50;
            --control-btn-color: #ffffff;
            --control-btn-hover: #888888;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }

        /* Партиклы на фоне */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            z-index: -1;
            animation: particles 10s infinite linear;
        }

        @keyframes particles {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }

        /* Эффект для звездочек, которые сыплются */
        .star {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: var(--star-color);
            border-radius: 50%;
            animation: fall 5s infinite linear;
        }

        @keyframes fall {
            from {
                transform: translateY(-100px);
                opacity: 1;
            }
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .container {
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        /* Новый квадратный проигрыватель */
        .music-player {
            width: 300px;
            height: 300px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
        }

        .track-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--avatar-border);
            overflow: hidden;
        }

        .track-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .progress-bar {
            width: 80%;
            height: 10px;
            background-color: #444;
            border-radius: 5px;
            margin: 10px 0;
            position: relative;
        }

        .progress {
            width: 50%; /* Примерный прогресс */
            height: 100%;
            background-color: var(--progress-color);
            border-radius: 5px;
        }

        .control-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--control-btn-color);
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .control-btn:hover {
            color: var(--control-btn-hover);
        }

        .control-btn:focus {
            outline: none;
        }

        .pause-play-btn {
            background-color: var(--accent);
            padding: 10px;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .pause-play-btn:hover {
            background-color: var(--button-hover);
        }

        .pause-play-btn:active {
            background-color: var(--button-active);
        }

    </style>
</head>
<body>

<div class="particles">
    <!-- Звездочки -->
    <div class="star" style="top: 10%; left: 20%;"></div>
    <div class="star" style="top: 30%; left: 40%;"></div>
    <div class="star" style="top: 50%; left: 60%;"></div>
    <div class="star" style="top: 70%; left: 80%;"></div>
</div>

<div class="container">
    <!-- Блок профиля -->
    <div class="card">
        <div class="profile-card">
            <div class="avatar">
                <img src="https://i.ibb.co/Wpj3fVx3/1000188901.jpg" alt="Avatar">
            </div>
            <div class="profile-info">
                <h1>Wolzer</h1>
            </div>
        </div>

        <div class="social-links-container">
            <a href="https://t.me/wolzerov" target="_blank" class="social-link-btn tg-btn">
                Telegram
            </a>
            <a href="https://www.tiktok.com/@wolzer" target="_blank" class="social-link-btn tt-btn">
                TikTok
            </a>
        </div>
    </div>

    <!-- About Me -->
    <div class="card">
        <span class="section-title">About Me</span>
        <div class="info-list">
            <div class="info-item"><span class="info-label">name:</span><span class="info-value">Alexander</span></div>
            <div class="info-item"><span class="info-label">phone:</span><span class="info-value">+7</span></div>
            <div class="info-item"><span class="info-label">from:</span><span class="info-value">Russia</span></div>
            <div class="info-item"><span class="info-label">birthday:</span><span class="info-value">28 August</span></div>
            <div class="info-item"><span class="info-label">timezone:</span><span class="info-value">+7</span></div>
        </div>
    </div>

    <!-- Таймер -->
    <div>
        <span class="section-title">Birthday Timer</span>
        <div class="footer-timer">
            <div class="timer-block"><span class="timer-num" id="days">0</span><span class="timer-label">DAYS</span></div>
            <div class="timer-block"><span class="timer-num" id="hours">0</span><span class="timer-label">HOURS</span></div>
            <div class="timer-block"><span class="timer-num" id="mins">0</span><span class="timer-label">MIN</span></div>
            <div class="timer-block"><span class="timer-num" id="secs">0</span><span class="timer-label">SEC</span></div>
        </div>
    </div>

    <!-- Музыкальный проигрыватель -->
    <div class="card">
        <div class="music-player">
            <!-- Аватарка трека -->
            <div class="track-avatar">
                <img src="https://i.ibb.co/Wpj3fVx3/1000188901.jpg" alt="Track Avatar">
            </div>

            <!-- Полоса прогресса -->
            <div class="progress-bar">
                <div class="progress"></div>
            </div>

            <!-- Кнопки управления -->
            <div class="control-buttons">
                <button class="control-btn">&#9664;</button> <!-- Предыдущий трек -->
                <button id="pause-play-btn" class="pause-play-btn">&#10074;&#10074;</button> <!-- Пауза/Продолжить -->
                <button class="control-btn">&#9654;</button> <!-- Следующий трек -->
            </div>
        </div>
    </div>

</div>

<script>
    // Инициализация состояния проигрывателя
    let isPlaying = false;

    // Элементы управления
    const pausePlayButton = document.getElementById('pause-play-btn');

    // Функция для смены состояния кнопки паузы/продолжения
    pausePlayButton.addEventListener('click', function() {
        if (isPlaying) {
            // Пауза
            pausePlayButton.innerHTML = '&#10074;&#10074;'; // Пауза
            isPlaying = false;
            pausePlayButton.style.backgroundColor = 'var(--accent)';
        } else {
            // Продолжение
            pausePlayButton.innerHTML = '&#10073;&#10073;'; // Продолжить
            isPlaying = true;
            pausePlayButton.style.backgroundColor = '#4caf50'; // Зеленый для продолжения
        }
    });

    function updateTimer(){
        const now = new Date();
        let year=now.getFullYear();
        let target=new Date(`${year}-08-28T00:00:00+07:00`);
        if(now>target){year++;target=new Date(`${year}-08-28T00:00:00+07:00`);}
        let diff=target-now;
        document.getElementById('days').innerText=Math.floor(diff/86400000);
        document.getElementById('hours').innerText=Math.floor((diff%86400000)/3600000).toString().padStart(2,'0');
        document.getElementById('mins').innerText=Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
        document.getElementById('secs').innerText=Math.floor((diff%60000)/1000).toString().padStart(2,'0');
    }
    setInterval(updateTimer,1000);
    updateTimer();
</script>

</body>
</html>
