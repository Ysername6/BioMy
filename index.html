<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolzer Bio</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0a0a0a;
            --border-color: #222222;
            --text-main: #ffffff;
            --text-secondary: #999999;
            --tag-bg: #151515;
            --accent: #4caf50;
            --avatar-border: #888888;
            --copy-btn-bg: #555555;
            --copy-btn-hover: #777777;
            --copy-btn-active: #ffffff;
        }

        body {
            margin:0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }

        /* Партиклы на фоне */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            z-index: -1;
            animation: particles 10s infinite linear;
        }

        @keyframes particles {
            from { transform: translateY(0); }
            to { transform: translateY(100%); }
        }

        #preloader {
            position: fixed;
            inset: 0;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #222;
            border-top: 3px solid #999;
            border-radius: 50%;
            animation: spin 2s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .loaded .container {
            opacity: 1;
            transform: translateY(0);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        .profile-card {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            border: 2px solid var(--avatar-border);
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info h1 {
            margin:0;
            font-family: monospace;
            letter-spacing: 1px;
            font-size: 24px;
        }

        .profile-info p {
            margin:4px 0 10px 0;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .social-links-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .social-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            transform: translateX(0);
            border: 1px solid var(--border-color);
            background-color: #000000;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .social-link-btn:hover {
            transform: translateX(4px);
        }

        /* Эффекты для кнопок соцсетей */
        .tg-btn:hover {
            background-color: #0088cc;
            color: #ffffff;
            border-color: #0088cc;
        }

        .tt-btn:hover {
            background-color: #ff0050;
            color: #000000;
            border-color: #ff0050;
        }

        .footer-timer {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 20px;
            border-radius:16px;
            border:1px solid var(--border-color);
            background:#0a0a0a;
        }

        .timer-block {
            text-align:center;
            width:60px;
        }

        .timer-num {
            font-size:22px;
            font-weight:700;
        }

        .timer-label {
            font-size:8px;
            color: var(--text-secondary);
            margin-top:4px;
        }

        .section-title {
            font-size:10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom:15px;
            display:block;
        }

        /* Новый блок About Me */
        .info-list {
            display: flex;
            flex-direction: column;
            gap:8px;
            font-family: monospace;
            font-size: 14px;
        }

        .info-item {
            display:flex;
            gap:6px;
        }

        .info-label {
            color: var(--text-secondary);
        }

        .info-value {
            font-weight:500;
        }

    </style>
</head>
<body>

<div id="preloader">
    <div class="spinner"></div>
    <div class="loader-text">Вход В Систему</div>
</div>

<div class="container">
    <!-- Блок профиля -->
    <div class="card">
        <div class="profile-card">
            <div class="avatar">
                <img src="https://i.ibb.co/Wpj3fVx3/1000188901.jpg" alt="Avatar">
            </div>
            <div class="profile-info">
                <h1>Wolzer</h1>
            </div>
        </div>

        <div class="social-links-container">
            <a href="https://t.me/wolzerov" target="_blank" class="social-link-btn tg-btn">
                Telegram
            </a>
            <a href="https://www.tiktok.com/@wolzer" target="_blank" class="social-link-btn tt-btn">
                TikTok
            </a>
        </div>
    </div>

    <!-- About Me в стиле Python-кода -->
    <div class="card">
        <span class="section-title">About Me</span>
        <div class="info-list">
            <div class="info-item"><span class="info-label">name:</span><span class="info-value">Alexander</span></div>
            <div class="info-item"><span class="info-label">phone:</span><span class="info-value">+7</span></div>
            <div class="info-item"><span class="info-label">from:</span><span class="info-value">Russia</span></div>
            <div class="info-item"><span class="info-label">birthday:</span><span class="info-value">28 August</span></div>
            <div class="info-item"><span class="info-label">timezone:</span><span class="info-value">+7</span></div>
        </div>
    </div>

    <!-- Таймер -->
    <div>
        <span class="section-title">Birthday Timer</span>
        <div class="footer-timer">
            <div class="timer-block"><span class="timer-num" id="days">0</span><span class="timer-label">DAYS</span></div>
            <div class="timer-block"><span class="timer-num" id="hours">0</span><span class="timer-label">HOURS</span></div>
            <div class="timer-block"><span class="timer-num" id="mins">0</span><span class="timer-label">MIN</span></div>
            <div class="timer-block"><span class="timer-num" id="secs">0</span><span class="timer-label">SEC</span></div>
        </div>
    </div>

</div>

<!-- Партиклы на фоне -->
<div class="particles"></div>

<script>
    window.addEventListener('load', function(){
        setTimeout(()=>{
            document.getElementById('preloader').style.opacity='0';
            setTimeout(() => {
                document.getElementById('preloader').style.visibility='hidden';
            }, 500);
            document.body.classList.add('loaded');
        }, 1200);
    });

    function updateTimer(){
        const now = new Date();
        let year=now.getFullYear();
        let target=new Date(`${year}-08-28T00:00:00+07:00`);
        if(now>target){year++;target=new Date(`${year}-08-28T00:00:00+07:00`);}
        let diff=target-now;
        document.getElementById('days').innerText=Math.floor(diff/86400000);
        document.getElementById('hours').innerText=Math.floor((diff%86400000)/3600000).toString().padStart(2,'0');
        document.getElementById('mins').innerText=Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
        document.getElementById('secs').innerText=Math.floor((diff%60000)/1000).toString().padStart(2,'0');
    }
    setInterval(updateTimer,1000);
    updateTimer();
</script>
</body>
    </html>
